version: '3.8'

services:
  # Dev settings for backend
  server:
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules

  # Dev settings for frontend...
  client:
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./client:/app
      - /app/node_modules
